[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "local-repo-db-mcp-server"
version         = "0.2.0"
description     = "MCP server (HTTP+SSE): read-only local repo + SELECT-only MySQL access"
readme          = "README.md"
requires-python = ">=3.10"

dependencies = [
    # MCP SDK + FastMCP high-level wrapper
    "mcp>=1.0.0",
    "fastmcp>=0.4.0",

    # HTTP transport
    "uvicorn[standard]>=0.29",
    "starlette>=0.37",

    # MySQL driver
    "mysql-connector-python>=8.3",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev      = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "black", "ruff"]

[project.scripts]
mcp-server = "src.server:main"
review-diff = "src.review_diff:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
